name: Weekly Afghan Security Digest

on:
  schedule:
    # 07:00 GMT every Monday. GitHub Actions cron is UTC, which equals GMT.
    - cron: "0 7 * * 1"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser requests beautifulsoup4 anthropic python-dateutil

      - name: Generate digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API }}
        run: python generate_digest.py

      - name: Commit updated page
        run: |
          git config user.name "digest-bot"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "Weekly digest: $(date -u +'%Y-%m-%d')" || echo "No changes to commit"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
